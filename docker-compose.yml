# Local infra for peja development.
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Reset:    docker compose down -v       (wipes volumes)
# Logs:     docker compose logs -f <svc>
#
# The NestJS API and Next.js app run on the host via `pnpm dev`. Only
# stateful infrastructure lives in containers. Image storage uses
# Cloudinary in dev + prod (configure CLOUDINARY_* env vars).

services:
  postgres:
    image: postgres:16-alpine
    container_name: peja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peja
      POSTGRES_PASSWORD: peja
      POSTGRES_DB: peja
    ports:
      - "5432:5432"
    volumes:
      - peja-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peja -d peja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  peja-postgres:
