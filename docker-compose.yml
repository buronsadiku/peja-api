# Local infra for peja development.
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Reset:    docker compose down -v       (wipes volumes)
# Logs:     docker compose logs -f <svc>
#
# The NestJS API and Next.js app run on the host via `pnpm dev`. Only
# stateful infrastructure lives in containers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: peja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peja
      POSTGRES_PASSWORD: peja
      POSTGRES_DB: peja
    ports:
      - "5432:5432"
    volumes:
      - peja-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peja -d peja"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: peja-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - peja-minio:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS http://localhost:9000/minio/health/live || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: create the upload bucket and set anonymous read on the
  # public prefix used for guest cover photos. Re-running is a no-op.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: peja-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/peja-uploads &&
      mc anonymous set download local/peja-uploads/public &&
      echo 'minio bootstrap complete'
      "
    restart: "no"

volumes:
  peja-postgres:
  peja-minio:
